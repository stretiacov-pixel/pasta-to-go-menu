<title>Pasta to go — menu</title>

<style>
[hidden] { display: none !important; }
:root {
  --bg: #f3f4ee; --surface: #ffffff; --sunken: #e9ebe3; --ink: #18261c; --ink-2: #48564b; --muted: #5f6b62; --line: #d9ddd1;
  --deep: #173323; --deep-ink: #e4efe6; --basil: #2c7448; --basil-ink: #ffffff; --basil-soft: #dfeee3;
  --semolina: #f2c24a; --semolina-ink: #2a2107; --semolina-soft: #faefc9; --tomato: #c23d29; --tomato-soft: #f7e0da;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 18px;
}
:lang(ar) { --f-body: "Noto Sans Arabic", system-ui, sans-serif; --f-display: "Noto Sans Arabic", system-ui, sans-serif; }
:lang(hi) { --f-body: "Noto Sans Devanagari", "Onest", system-ui, sans-serif; --f-display: "Noto Sans Devanagari", "Unbounded", system-ui, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1511; --surface: #171f19; --sunken: #212a23; --ink: #e8eee6; --ink-2: #b6c2b7; --muted: #8f9b90; --line: #2c372e;
    --deep: #0a110c; --deep-ink: #d6e4d9; --basil: #62b783; --basil-ink: #0c1a10; --basil-soft: #1f3a28;
    --semolina: #f0c654; --semolina-ink: #2a2107; --semolina-soft: #3a3118; --tomato: #f07a62; --tomato-soft: #3d221d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1511; --surface: #171f19; --sunken: #212a23; --ink: #e8eee6; --ink-2: #b6c2b7; --muted: #8f9b90; --line: #2c372e;
  --deep: #0a110c; --deep-ink: #d6e4d9; --basil: #62b783; --basil-ink: #0c1a10; --basil-soft: #1f3a28;
  --semolina: #f0c654; --semolina-ink: #2a2107; --semolina-soft: #3a3118; --tomato: #f07a62; --tomato-soft: #3d221d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 3px solid var(--semolina); outline-offset: 2px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.mark { width: 48px; height: 48px; border-radius: 15px; background: var(--semolina); color: var(--semolina-ink); display: grid; place-items: center; font: 700 14px/1 "Unbounded", "Arial Black", sans-serif; letter-spacing: -0.03em; flex: none; }

/* language picker */
.langs { min-height: 100vh; min-height: 100dvh; background: var(--deep); color: var(--deep-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(32px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px)); margin-bottom: calc(-96px - env(safe-area-inset-bottom, 0px)); }
.langs .mark { width: 72px; height: 72px; border-radius: 22px; font-size: 21px; }
.langs h1 { margin: 16px 0 4px; font: 700 28px/1.1 "Unbounded", "Arial Black", sans-serif; color: #fff; letter-spacing: -0.02em; }
.langs p { margin: 0 0 28px; opacity: .8; font-size: 15px; text-align: center; }
.langs ul { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 380px; display: grid; gap: 10px; }
.langs button { width: 100%; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; border-radius: 16px; border: 1.5px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #fff; font-size: 19px; font-weight: 600; text-align: start; }
.langs button small { font-size: 13px; font-weight: 500; opacity: .65; font-family: "Onest", system-ui, sans-serif; }
.langs button[aria-current="true"] { background: var(--semolina); border-color: var(--semolina); color: var(--semolina-ink); }
.langs button[lang="ar"] { font-family: "Noto Sans Arabic", system-ui, sans-serif; }
.langs button[lang="hi"] { font-family: "Noto Sans Devanagari", system-ui, sans-serif; }

/* header */
.top { background: var(--deep); color: var(--deep-ink); padding: calc(18px + env(safe-area-inset-top, 0px)) 0 22px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { margin: 0; font: 700 22px/1.1 "Unbounded", "Arial Black", sans-serif; letter-spacing: -0.02em; color: #fff; }
.brand p { margin: 2px 0 0; font-size: 14px; opacity: .8; }
.langbtn { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,.25); background: none; color: var(--deep-ink); border-radius: 999px; padding: 0 14px; min-height: 40px; font-size: 14px; font-weight: 600; }
.langbtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; }
.state { margin-top: 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.08); }
.state i { width: 9px; height: 9px; border-radius: 50%; background: #7bd59a; }
.state.off i { background: #f0a090; }

/* categories */
.cats { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.cats .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; }
.cats .wrap::-webkit-scrollbar { display: none; }
.cats button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 15px; min-height: 42px; }
.cats button[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* menu */
.note { margin: 16px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--semolina-soft); color: var(--ink); font-size: 15px; }
section.cat { scroll-margin-top: 72px; padding-top: 24px; }
section.cat h2 { margin: 0 0 14px; font: 700 20px/1.2 var(--f-display); letter-spacing: -0.01em; }
.grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 560px) { .grid { grid-template-columns: 1fr 1fr; } }
.dish { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.dish .ph { position: relative; aspect-ratio: 4 / 3; background: var(--sunken); overflow: hidden; }
.dish .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dish .ph.noimg::after { content: "PtG"; position: absolute; inset: 0; display: grid; place-items: center; font: 700 34px "Unbounded", sans-serif; color: var(--line); }
.dish .ph .tag { position: absolute; inset-inline-start: 12px; top: 12px; background: rgba(24,38,28,.85); color: #fff; font-size: 13px; font-weight: 600; padding: 5px 10px; border-radius: 999px; }
.dish .body { padding: 14px 16px 16px; display: grid; gap: 10px; }
.dish h3 { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.25; }
.dish .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.dish .price { font: 500 18px var(--f-display); color: var(--basil); font-variant-numeric: tabular-nums; }
.dish.out .ph img { filter: grayscale(1); opacity: .55; }
.dish.out .price { color: var(--muted); }
.add { flex: none; min-width: 48px; height: 48px; border-radius: 14px; border: 0; background: var(--basil); color: var(--basil-ink); font-size: 26px; line-height: 1; font-weight: 500; padding: 0 14px; }
.step { flex: none; display: flex; align-items: center; background: var(--basil-soft); border-radius: 14px; }
.step button { width: 46px; height: 48px; border: 0; background: none; font-size: 22px; font-weight: 600; color: var(--basil); }
.step span { min-width: 24px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.pick { flex: none; display: flex; align-items: center; gap: 10px; }
.incart { font-weight: 700; color: var(--basil); font-size: 15px; font-variant-numeric: tabular-nums; }
.line .info small.adds { color: var(--basil); font-weight: 600; }
.aopt { display: flex; align-items: center; gap: 12px; margin: 0; padding: 14px 4px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 17px; cursor: pointer; }
.aopt input { width: 24px; height: 24px; flex: none; accent-color: var(--basil); }
.aopt span { flex: 1; }
.aopt b { font: 500 16px var(--f-display); color: var(--basil); font-variant-numeric: tabular-nums; }
.adish { display: flex; gap: 12px; align-items: center; margin: 4px 0 6px; }
.adish img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--sunken); }
.adish p { margin: 0; color: var(--muted); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; }

/* bottom bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.bar button { display: flex; width: 100%; max-width: 728px; margin: 0 auto; align-items: center; justify-content: space-between; gap: 12px; border: 0; border-radius: 16px; background: var(--semolina); color: var(--semolina-ink); padding: 0 20px; min-height: 58px; font-weight: 700; font-size: 17px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.bar .sum { font-family: var(--f-display); font-weight: 500; font-variant-numeric: tabular-nums; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: rgba(10,17,12,.55); }
.sheet .panel { width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet h2 { margin: 0; font: 700 20px var(--f-display); }
.x { border: 0; background: var(--sunken); width: 44px; height: 44px; border-radius: 50%; font-size: 22px; }
.line { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex: none; background: var(--sunken); }
.line .info { flex: 1; min-width: 0; }
.line .info small { display: block; color: var(--muted); font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 6px; font-weight: 700; font-size: 18px; }
.total span:last-child { font-family: var(--f-display); font-weight: 500; }
label { display: block; font-weight: 600; font-size: 15px; margin: 14px 0 6px; }
label small { font-weight: 400; color: var(--muted); }
input, textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; font-size: 17px; }
textarea { resize: vertical; min-height: 64px; }
.pay { margin: 14px 0 0; color: var(--ink-2); font-size: 14px; }
.cta { width: 100%; margin-top: 16px; min-height: 56px; border: 0; border-radius: 16px; background: var(--basil); color: var(--basil-ink); font-weight: 700; font-size: 17px; }
.cta:disabled { opacity: .55; cursor: default; }
.err { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: var(--tomato-soft); color: var(--tomato); font-weight: 600; font-size: 15px; }

/* order tracker */
.track { padding-top: 24px; }
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 24px 20px; text-align: center; }
.ticket .lbl { color: var(--muted); font-weight: 600; font-size: 15px; }
.ticket .num { font: 700 72px/1 "Unbounded", sans-serif; letter-spacing: -0.04em; margin: 8px 0 4px; }
.ticket .who { color: var(--ink-2); }
.ticket .msg { margin: 20px 0 0; font-size: 19px; font-weight: 700; }
.ticket .sub { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.ticket.ready { background: var(--basil); border-color: var(--basil); color: var(--basil-ink); }
.ticket.ready .lbl, .ticket.ready .who, .ticket.ready .sub { color: inherit; opacity: .85; }
.ticket.cancelled { background: var(--tomato-soft); border-color: var(--tomato-soft); }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 18px; }
.steps div { height: 6px; border-radius: 3px; background: var(--sunken); }
.steps div.on { background: var(--semolina); }
.ticket.ready .steps div { background: rgba(255,255,255,.9); }
.recap { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 16px; }
.recap .line:last-child { border-bottom: 0; }
.ghost { width: 100%; margin-top: 16px; min-height: 52px; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; font-weight: 600; }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 28px 16px 8px; }
@media (prefers-reduced-motion: no-preference) {
  .sheet .panel { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: .6; } }
  .ticket.ready { animation: pop .4s ease-out; }
  @keyframes pop { 50% { transform: scale(1.03); } }
  .langs ul { animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } }
}
</style>
</head>
<body>
<section class="langs" id="langView" hidden>
  <div class="mark" aria-hidden="true">PtG</div>
  <h1>Pasta to go</h1>
  <p>Alegeți limba · Choose your language · Выберите язык</p>
  <ul id="langList"></ul>
</section>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true">PtG</div>
      <div><h1>Pasta to go</h1><p data-t="tagline"></p></div>
      <button type="button" class="langbtn" id="changeLang"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span id="langCode"></span></button>
    </div>
    <div class="state" id="state" hidden><i></i><span></span></div>
  </div>
</header>

<main id="menuView">
  <nav class="cats" id="cats" hidden><div class="wrap" id="catList"></div></nav>
  <div class="wrap">
    <p class="note" id="closedNote" hidden></p>
    <div id="menu"><p class="empty" data-t="loading"></p></div>
  </div>
</main>

<main id="trackView" class="wrap track" hidden>
  <div class="ticket" id="ticket">
    <div class="lbl" data-t="yourOrder"></div>
    <div class="num" id="tNum"></div>
    <div class="who" id="tWho"></div>
    <div class="steps" aria-hidden="true"><div></div><div></div><div></div></div>
    <p class="msg" id="tMsg"></p>
    <p class="sub" id="tSub"></p>
  </div>
  <div class="recap" id="tLines"></div>
  <button type="button" class="ghost" id="newOrder" data-t="newOrder"></button>
</main>

<footer data-t="footer"></footer>
</div>

<div class="bar" id="bar" hidden><button type="button" id="openCart"><span id="barText"></span><span class="sum" id="barSum"></span></button></div>

<div class="sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="head"><h2 id="sheetTitle" data-t="cart"></h2><button type="button" class="x" id="closeCart">×</button></div>
    <div id="lines"></div>
    <div class="total"><span data-t="total"></span><span id="total"></span></div>
    <form id="orderForm" novalidate>
      <label for="gName"><span data-t="name"></span> <small data-t="nameHint"></small></label>
      <input id="gName" maxlength="40" autocomplete="given-name" required>
      <label for="gNote"><span data-t="comment"></span> <small data-t="optional"></small></label>
      <textarea id="gNote" maxlength="200" rows="2"></textarea>
      <p class="pay" data-t="payInfo"></p>
      <div class="err" id="err" role="alert" hidden></div>
      <button type="submit" class="cta" id="send"></button>
    </form>
  </div>
</div>

<div class="sheet" id="aSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="aTitle">
    <div class="head"><h2 id="aTitle"></h2><button type="button" class="x" id="aClose">×</button></div>
    <div class="adish"><img id="aImg" alt=""><p data-t="addonsTitle"></p></div>
    <div id="aOpts"></div>
    <button type="button" class="cta" id="aAdd"></button>
  </div>
</div>

function plural(n, f) { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? f[0] : a >= 2 && a <= 4 && (b < 12 || b > 14) ? f[1] : f[2]; }

const store = {
  get(k, d) { try { const v = localStorage.getItem("ptgqr-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { v == null ? localStorage.removeItem("ptgqr-" + k) : localStorage.setItem("ptgqr-" + k, JSON.stringify(v)); } catch {} },
};
const session = {
  get(k) { try { return sessionStorage.getItem("ptgqr-" + k); } catch { return null; } },
  set(k, v) { try { sessionStorage.setItem("ptgqr-" + k, v); } catch {} },
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

let lang = store.get("lang", null);
if (!T[lang]) lang = null;
let menu = null, cart = store.get("cart", {}), activeOrder = store.get("order", null), pollTimer = null, sending = false;
const t = k => T[lang || "en"][k];
const money = v => `${(+v).toLocaleString(LOCALE[lang] || "en-GB", { maximumFractionDigits: 2 })} ${t("cur")}`;
const dishName = d => { const x = DISH[d.id]; return x && x.ru === d.name && x[lang] ? x[lang] : d.name; };
const addonName = a => { const x = ADDON[a.id]; return x && x.ru === a.name && x[lang] ? x[lang] : a.name; };
/* cart: { "dishId" | "dishId|addon1,addon2": qty } */
const keyOf = (id, adds) => adds.length ? `${id}|${[...adds].sort().join(",")}` : id;
const parseKey = k => { const [id, a] = k.split("|"); return { id, adds: a ? a.split(",") : [] }; };
const addonsFor = d => (menu?.addons || []).filter(a => a.available && (a.categories || []).includes(d.category));
const qtyOf = id => Object.entries(cart).reduce((s, [k, q]) => s + (parseKey(k).id === id ? q : 0), 0);
const catName = c => (lang !== "ru" && CAT[c]?.[lang]) || c;
// photo uploaded from the register wins; otherwise the temporary one in img/
const img = id => menu?.items.find(i => i.id === id)?.photo || `img/${encodeURIComponent(id)}.jpg?v=${IMG_V}`;

async function rpc(fn, body = {}) {
  const r = await fetch(API + fn, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => null);
  if (!r.ok) throw Object.assign(new Error(data?.message || "http " + r.status), { api: true });
  return data;
}

/* ---------- language ---------- */
function showLangPicker() {
  $("#langList").innerHTML = LANGS.map(([c, native, en]) => `<li><button type="button" data-pick="${c}" lang="${c}"${c === lang ? ' aria-current="true"' : ""}><span>${native}</span>${native !== en ? `<small>${en}</small>` : ""}</button></li>`).join("");
  $("#langView").hidden = false; $("#app").hidden = true; $("#bar").hidden = true;
  document.documentElement.lang = lang || "en"; document.documentElement.dir = "ltr";
  window.scrollTo(0, 0);
}
function pickLang(c) {
  lang = c; store.set("lang", c); session.set("langChosen", "1");
  $("#langView").hidden = true; $("#app").hidden = false;
  applyLang(); window.scrollTo(0, 0);
}

/* ---------- render ---------- */
function applyLang() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("#app [data-t], #sheet [data-t], #aSheet [data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });
  $("#langCode").textContent = LANGS.find(l => l[0] === lang)[1];
  $("#changeLang").setAttribute("aria-label", t("langLabel"));
  $("#closeCart").setAttribute("aria-label", t("close"));
  $("#send").textContent = t("send");
  renderMenu(); renderCart(); renderTrack();
}

function cats() { const out = []; (menu?.items || []).forEach(i => { if (!out.includes(i.category)) out.push(i.category); }); return out; }
const slug = c => "c-" + [...c].map(ch => ch.charCodeAt(0).toString(36)).join("");

function renderMenu() {
  if (!menu || !lang) return;
  const st = $("#state"); st.hidden = false; st.classList.toggle("off", !menu.accepting);
  st.querySelector("span").textContent =menu.accepting ? t("open") : t("closed");
  $("#closedNote").hidden = menu.accepting; $("#closedNote").textContent = t("closedNote");
  const list = cats();
  $("#cats").hidden = list.length < 2 || !!activeOrder;
  $("#catList").innerHTML = list.map((c, i) => `<button type="button" data-go="${slug(c)}"${i === 0 ? ' aria-current="true"' : ""}>${esc(catName(c))}</button>`).join("");
  if (!menu.items.length) { $("#menu").innerHTML = `<p class="empty">${t("empty")}</p>`; return; }
  $("#menu").innerHTML = list.map(c => `<section class="cat" id="${slug(c)}"><h2>${esc(catName(c))}</h2><div class="grid">${menu.items.filter(i => i.category === c).map(dishHTML).join("")}</div></section>`).join("");
  watchCats();
}
function dishHTML(d) {
  const can = menu.accepting && d.available, name = dishName(d), withAdds = addonsFor(d).length > 0;
  const q = withAdds ? qtyOf(d.id) : cart[d.id] || 0;
  const ctl = !can ? "" : withAdds
    ? `<span class="pick">${q ? `<span class="incart">${q} ${esc(t("inCart"))}</span>` : ""}<button type="button" class="add" data-pickfor="${esc(d.id)}" aria-label="${esc(t("addOne"))}: ${esc(name)}">+</button></span>`
    : q ? stepHTML(d.id, q) : `<button type="button" class="add" data-inc="${esc(d.id)}" aria-label="${esc(t("addOne"))}: ${esc(name)}">+</button>`;
  return `<article class="dish${d.available ? "" : " out"}">
    <div class="ph"><img src="${img(d.id)}" alt="" loading="lazy" decoding="async" data-ph>${d.available ? "" : `<span class="tag">${t("out")}</span>`}</div>
    <div class="body"><h3>${esc(name)}</h3><div class="row"><span class="price">${money(d.price)}</span>${ctl}</div></div></article>`;
}
const stepHTML = (id, q) => `<div class="step"><button type="button" data-dec="${esc(id)}" aria-label="${esc(t("remove"))}">−</button><span>${q}</span><button type="button" data-inc="${esc(id)}" aria-label="${esc(t("addOne"))}">+</button></div>`;
// photo missing → neutral placeholder instead of a broken image
document.addEventListener("error", e => { const im = e.target; if (im.tagName === "IMG" && im.hasAttribute("data-ph")) { im.parentElement.classList.add("noimg"); im.remove(); } }, true);

function cartLines() {
  return Object.entries(cart).map(([key, qty]) => {
    const { id, adds } = parseKey(key), d = menu?.items.find(i => i.id === id);
    const al = adds.map(a => (menu?.addons || []).find(x => x.id === a));
    if (!d || al.some(a => !a)) return null;
    return { key, d, qty, adds: al, unit: +d.price + al.reduce((s, a) => s + +a.price, 0) };
  }).filter(l => l && l.d.available && l.adds.every(a => a.available) && l.qty > 0);
}
const addsLine = adds => adds?.length ? `<small class="adds">+ ${adds.map(a => esc(addonName(a))).join(", ")}</small>` : "";
function renderCart() {
  if (!menu || !lang) return;
  const lines = cartLines(), count = lines.reduce((s, l) => s + l.qty, 0), sum = lines.reduce((s, l) => s + l.qty * l.unit, 0);
  $("#bar").hidden = !count || !menu.accepting || !!activeOrder || !$("#langView").hidden;
  $("#barText").textContent = `${t("show")} · ${t("items")(count)}`; $("#barSum").textContent = money(sum);
  $("#lines").innerHTML = lines.map(l => `<div class="line"><img src="${img(l.d.id)}" alt="" data-ph><div class="info"><b>${esc(dishName(l.d))}</b>${addsLine(l.adds)}<small>${money(l.unit)} × ${l.qty} = ${money(l.unit * l.qty)}</small></div>${stepHTML(l.key, l.qty)}</div>`).join("");
  $("#total").textContent = money(sum);
  if (!count && !$("#sheet").hidden) closeSheet();
}

function renderTrack() {
  if (!lang) return;
  const on = !!activeOrder;
  $("#trackView").hidden = !on; $("#menuView").hidden = on;
  if (!on) return;
  const o = activeOrder, s = o.status || "new", [msg, sub] = t("s_" + s) || t("s_new");
  $("#tNum").textContent = o.num; $("#tWho").textContent = o.name || ""; $("#tMsg").textContent = msg; $("#tSub").textContent = sub;
  const tk = $("#ticket"); tk.className = "ticket" + (s === "ready" || s === "done" ? " ready" : s === "cancelled" ? " cancelled" : "");
  const lvl = { new: 1, accepted: 2, ready: 3, done: 3, cancelled: 0 }[s] ?? 1;
  tk.querySelectorAll(".steps div").forEach((d, i) => d.classList.toggle("on", i < lvl));
  $("#tLines").innerHTML = (o.items || []).map(i => `<div class="line"><div class="info"><b>${esc(dishName(i))}</b>${addsLine(i.addons)}<small>${money(i.price)} × ${i.qty}</small></div><b>${money(i.price * i.qty)}</b></div>`).join("")
    + `<div class="total"><span>${t("total")}</span><span>${money(o.total)}</span></div>`;
  $("#bar").hidden = true; $("#cats").hidden = true;
}

/* ---------- category chips follow scroll ---------- */
let catObs = null;
function watchCats() {
  catObs?.disconnect();
  if (!("IntersectionObserver" in window)) return;
  catObs = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    document.querySelectorAll("#catList button").forEach(b => {
      const on = b.dataset.go === e.target.id;
      if (on) { b.setAttribute("aria-current", "true"); b.scrollIntoView({ block: "nearest", inline: "nearest" }); } else b.removeAttribute("aria-current");
    });
  }), { rootMargin: "-80px 0px -70% 0px" });
  document.querySelectorAll("section.cat").forEach(s => catObs.observe(s));
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const inc = e.target.closest("[data-inc]"), dec = e.target.closest("[data-dec]"), go = e.target.closest("[data-go]"), pick = e.target.closest("[data-pick]");
  const pf = e.target.closest("[data-pickfor]");
  if (pf) openAddons(pf.dataset.pickfor);
  else if (pick) pickLang(pick.dataset.pick);
  else if (inc) { const id = inc.dataset.inc; cart[id] = Math.min(20, (cart[id] || 0) + 1); saveCart(); }
  else if (dec) { const id = dec.dataset.dec; cart[id] = (cart[id] || 0) - 1; if (cart[id] <= 0) delete cart[id]; saveCart(); }
  else if (go) document.getElementById(go.dataset.go)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
$("#changeLang").onclick = showLangPicker;
function saveCart() { store.set("cart", cart); renderMenu(); renderCart(); }
$("#openCart").onclick = () => { $("#err").hidden = true; $("#gName").value = $("#gName").value || store.get("name", ""); $("#sheet").hidden = false; document.body.style.overflow = "hidden"; };
function closeSheet() { $("#sheet").hidden = true; document.body.style.overflow = ""; }
$("#closeCart").onclick = closeSheet;
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (!$("#aSheet").hidden) closeAddons(); else if (!$("#sheet").hidden) closeSheet(); });

/* add-on picker */
let aDish = null;
function openAddons(id) {
  aDish = menu?.items.find(i => i.id === id); if (!aDish) return;
  $("#aTitle").textContent = dishName(aDish);
  $("#aImg").src = img(aDish.id);
  $("#aOpts").innerHTML = addonsFor(aDish).map(a => `<label class="aopt"><input type="checkbox" value="${esc(a.id)}"><span>${esc(addonName(a))}</span><b>+${money(a.price)}</b></label>`).join("");
  aPrice(); $("#aSheet").hidden = false; document.body.style.overflow = "hidden";
}
function aChecked() { return [...$("#aOpts").querySelectorAll("input:checked")].map(i => i.value); }
function aPrice() {
  const sum = +aDish.price + aChecked().reduce((s, id) => s + +(menu.addons.find(a => a.id === id)?.price || 0), 0);
  $("#aAdd").textContent = `${t("addToOrder")} · ${money(sum)}`;
}
function closeAddons() { $("#aSheet").hidden = true; document.body.style.overflow = ""; aDish = null; }
$("#aOpts").addEventListener("change", aPrice);
$("#aClose").onclick = closeAddons;
$("#aSheet").addEventListener("click", e => { if (e.target.id === "aSheet") closeAddons(); });
$("#aAdd").onclick = () => { const k = keyOf(aDish.id, aChecked()); cart[k] = Math.min(20, (cart[k] || 0) + 1); closeAddons(); saveCart(); };

function showErr(msg) { const el = $("#err"); el.textContent = msg; el.hidden = false; }
$("#orderForm").onsubmit = async e => {
  e.preventDefault(); if (sending) return;
  const name = $("#gName").value.trim(), note = $("#gNote").value.trim(), lines = cartLines();
  if (!name) { showErr(t("e_name")); $("#gName").focus(); return; }
  if (!lines.length) return;
  sending = true; $("#send").disabled = true; $("#send").textContent = t("sending"); $("#err").hidden = true;
  try {
    const r = await rpc("ptg_place_order", { p_items: lines.map(l => ({ id: l.d.id, qty: l.qty, addons: l.adds.map(a => a.id) })), p_name: name, p_note: note || null });
    store.set("name", name);
    activeOrder = { id: r.id, num: r.num, total: r.total, name, status: "new", items: lines.map(l => ({ id: l.d.id, name: l.d.name, qty: l.qty, price: l.unit, addons: l.adds })) };
    store.set("order", activeOrder); cart = {}; store.set("cart", cart); $("#gNote").value = "";
    closeSheet(); renderMenu(); renderCart(); renderTrack(); window.scrollTo(0, 0); poll();
  } catch (err) {
    const m = String(err.message || "");
    if (!err.api) showErr(t("e_net"));
    else if (m === "closed") { showErr(t("e_closed")); loadMenu(); }
    else if (m === "busy") showErr(t("e_busy"));
    else if (m.startsWith("unavailable:")) { const raw = m.slice(12), it = menu?.items.find(i => i.name === raw), ad = menu?.addons?.find(a => a.name === raw); showErr(t("e_unavailable")(it ? dishName(it) : ad ? addonName(ad) : raw)); loadMenu(); }
    else if (m === "bad_name") showErr(t("e_name"));
    else showErr(t("e_net"));
  } finally { sending = false; $("#send").disabled = false; $("#send").textContent = t("send"); }
};
$("#newOrder").onclick = () => { activeOrder = null; store.set("order", null); clearTimeout(pollTimer); renderTrack(); renderMenu(); renderCart(); loadMenu(); };

/* ---------- data ---------- */
async function loadMenu() {
  try { menu = await rpc("ptg_menu"); }
  catch { if (!menu && lang) $("#menu").innerHTML = `<p class="empty">${t("e_menu")}</p>`; return; }
  menu.addons = menu.addons || [];
  for (const k of Object.keys(cart)) {
    const { id, adds } = parseKey(k);
    if (!menu.items.some(i => i.id === id && i.available) || !adds.every(a => menu.addons.some(x => x.id === a && x.available))) delete cart[k];
  }
  store.set("cart", cart); renderMenu(); renderCart();
}
async function poll() {
  clearTimeout(pollTimer);
  if (!activeOrder) return;
  try {
    const o = await rpc("ptg_order_status", { p_id: activeOrder.id });
    if (!o) { activeOrder = null; store.set("order", null); renderTrack(); renderMenu(); renderCart(); return; }
    const was = activeOrder.status;
    activeOrder = { ...activeOrder, status: o.status, num: o.num, total: o.total, items: o.items };
    store.set("order", activeOrder); renderTrack();
    if (was !== "ready" && o.status === "ready" && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch {}
  if (activeOrder && !["done", "cancelled"].includes(activeOrder.status)) pollTimer = setTimeout(poll, document.hidden ? 20000 : 6000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (activeOrder) poll(); else loadMenu(); } });

/* ---------- start: language first (skipped mid-order or once chosen in this visit) ---------- */
loadMenu();
if (lang && (activeOrder || session.get("langChosen"))) { $("#app").hidden = false; applyLang(); }
else showLangPicker();
if (activeOrder) poll();
setInterval(() => { if (!activeOrder && !document.hidden) loadMenu(); }, 60000);
</script>
</body>
</html>
